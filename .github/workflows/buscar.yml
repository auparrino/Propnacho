name: Buscar propiedades

on:
  # Corre solo todos los días a las 8:00 y 19:00 (hora Argentina).
  # Para cambiar el horario: https://crontab.guru (está en hora UTC = Argentina + 3)
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 22 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # También corre cuando editás config.yml
  push:
    paths:
      - config.yml

permissions:
  contents: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name "propnacho-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Resultados $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Páginas de diagnóstico (si algún portal no devolvió nada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
